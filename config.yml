baseurl: "https://brunoluiz.net"
title: "Bruno Luiz da Silva"
theme: "PaperMod"
languageCode: "en"
enableEmoji: true
outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS
outputFormats:
  RSS:
    mediaType: "application/rss+xml"
    rel: "alternate"
    isPlainText: true
pagination:
  pagerSize: 7
summaryLength: 300
params:
  title: Bruno Luiz da Silva
  description: A collection of random software engineering thoughts
  images:
    - cover.jpg
  defaultTheme: "auto"
  homeInfoParams:
    Title: 👨‍💻 Bruno Luiz Silva
    Content: A collection of random software engineering thoughts
  cover:
    hiddenInList: true
  socialIcons: # optional
    - name: "rss"
      url: "/index.xml"
    - name: "email"
      url: "mailto:contact@brunoluiz.net"
    - name: "github"
      url: "https://github.com/brunoluiz"
    - name: "twitter"
      url: "https://twitter.com/brunoluiz"
    - name: "linkedin"
      url: "https://uk.linkedin.com/in/brnluiz"
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowFullTextinRSS: true
menu:
  main:
    - name: 🎙️ Conferences Archive
      url: /talks/
      weight: 10
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: catppuccin-mocha
    lineNos: true
    tabWidth: 2
